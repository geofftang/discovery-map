<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Map</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <section class="toolbar" aria-label="Map controls">
        <div class="toolbar-summary">
          <div class="brand">
            <h1>Discovery Map</h1>
            <span id="result-count">Loading places...</span>
          </div>
          <button id="toolbar-toggle" class="toolbar-toggle" type="button" aria-label="Collapse filters" aria-expanded="true">−</button>
        </div>

        <div class="controls">
          <label class="control search-control">
            <div class="search-wrapper">
              <input id="search-input" type="search" placeholder="Name, note, tag" autocomplete="off">
              <button id="search-clear" type="button" class="search-clear" aria-label="Clear search" hidden>×</button>
            </div>
            <div id="search-results" class="search-results" hidden></div>
          </label>

          <fieldset class="control category-control">
            <div id="category-options" class="category-options"></div>
          </fieldset>
        </div>
      </section>

      <aside id="details" class="details" hidden>
        <div class="details-header">
          <h2 id="details-name"></h2>
          <button id="details-close" type="button" aria-label="Close details">×</button>
        </div>
        <div id="details-meta" class="details-meta"></div>
        <p id="details-description" class="details-description"></p>
        <a id="google-link" class="primary-action" href="#" target="_blank" rel="noopener">Open in Google Maps</a>
      </aside>

      <div id="status" class="status" role="status">Loading map...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
