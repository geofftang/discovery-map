<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Map</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <section class="toolbar" aria-label="Map controls">
        <div class="toolbar-summary">
          <div class="brand">
            <h1>Discovery Map</h1>
            <span id="result-count">Loading places...</span>
            <span id="private-badge" class="private-badge" hidden>private</span>
          </div>
          <button id="toolbar-toggle" class="toolbar-toggle" type="button" aria-label="Collapse filters" aria-expanded="true">−</button>
        </div>

        <div class="controls">
          <label class="control search-control">
            <div class="search-wrapper">
              <input id="search-input" type="search" placeholder="Name, note, tag" autocomplete="off">
              <button id="search-clear" type="button" class="search-clear" aria-label="Clear search" hidden>×</button>
            </div>
            <div id="search-results" class="search-results" hidden></div>
          </label>

          <fieldset class="control category-control">
            <div id="category-options" class="category-options"></div>
          </fieldset>

          <label id="show-all-control" class="control show-all-control" hidden>
            <input id="show-all" type="checkbox"> <span>Show closed &amp; hidden</span>
          </label>
        </div>
      </section>

      <aside id="details" class="details" hidden>
        <div class="details-header">
          <h2 id="details-name"></h2>
          <button id="details-close" type="button" aria-label="Close details">×</button>
        </div>
        <div id="details-meta" class="details-meta"></div>
        <p id="details-advisory" class="details-advisory" hidden></p>
        <div id="details-scroll" class="details-scroll">
          <section id="details-take-block" class="details-take" hidden>
            <h3 class="details-label details-label--take">My take</h3>
            <p id="details-take" class="details-take-body"></p>
          </section>
          <section id="details-notes-block">
            <h3 id="details-notes-label" class="details-label" hidden>Notes</h3>
            <p id="details-description" class="details-description"></p>
          </section>
          <section id="details-evidence-block" hidden>
            <h3 class="details-label">Evidence</h3>
            <ul id="details-evidence" class="details-evidence"></ul>
          </section>
          <section id="details-history-block" hidden>
            <h3 class="details-label">History</h3>
            <ul id="details-history" class="details-history"></ul>
          </section>
          <section id="details-edit" class="details-edit" hidden>
            <h3 class="details-label">Edit</h3>
            <div class="edit-verbs">
              <button id="edit-hide" type="button">Hide</button>
              <button id="edit-status" type="button">Mark closed</button>
              <button id="edit-move" type="button">Move pin</button>
            </div>
            <div class="edit-note">
              <textarea id="edit-note-text" rows="2" maxlength="2000" placeholder="Add a note (goes to this place's log)"></textarea>
              <button id="edit-note-save" type="button">Save note</button>
            </div>
            <ul id="details-pending" class="details-pending"></ul>
          </section>
        </div>
        <a id="google-link" class="primary-action" href="#" target="_blank" rel="noopener">Open in Google Maps</a>
      </aside>

      <div id="status" class="status" role="status">Loading map...</div>
      <div id="edit-error" class="edit-error" role="alert" hidden><span id="edit-error-text"></span> <button id="edit-error-dismiss" type="button" aria-label="Dismiss">×</button></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
